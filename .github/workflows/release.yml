name: CountAway Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version name to build
        required: true
        default: "1.0.0"
        type: string
      mode:
        description: Release action
        required: true
        default: release-candidate
        type: choice
        options:
          - release-candidate
          - prepare-draft-release
  push:
    tags:
      - "v*"

jobs:
  build-signed-apk:
    name: Build signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      prepare_release: ${{ steps.version.outputs.prepare_release }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve release version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            PREPARE_RELEASE="true"
          else
            VERSION="${REQUESTED_VERSION}"

            case "${REQUESTED_MODE}" in
              release-candidate)
                PREPARE_RELEASE="false"
                ;;
              prepare-draft-release)
                PREPARE_RELEASE="true"
                if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
                  echo "Draft releases must be prepared from main, got: ${GITHUB_REF}" >&2
                  exit 1
                fi
                ;;
              *)
                echo "Unsupported release mode: ${REQUESTED_MODE}" >&2
                exit 1
                ;;
            esac
          fi

          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a semantic version such as 1.0.0, got: ${VERSION}" >&2
            exit 1
          fi

          printf 'version=%s\n' "${VERSION}" >> "${GITHUB_OUTPUT}"
          printf 'prepare_release=%s\n' "${PREPARE_RELEASE}" >> "${GITHUB_OUTPUT}"
          printf 'VERSION=%s\n' "${VERSION}" >> "${GITHUB_ENV}"
          printf 'PREPARE_RELEASE=%s\n' "${PREPARE_RELEASE}" >> "${GITHUB_ENV}"

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validate release metadata
        id: metadata
        run: |
          set -euo pipefail

          grep -Fq "versionName = \"${VERSION}\"" app/build.gradle.kts

          VERSION_CODE="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "${VERSION_CODE}"
          printf 'version_code=%s\n' "${VERSION_CODE}" >> "${GITHUB_OUTPUT}"

          if [[ "${PREPARE_RELEASE}" == "true" ]]; then
            test -f "docs/releases/${VERSION}.md"
          fi

      - name: Build optimized release
        run: ./gradlew clean test lint assembleRelease --stacktrace

      - name: Sign and verify APK
        env:
          VERSION_CODE: ${{ steps.metadata.outputs.version_code }}
          COUNTAWAY_RELEASE_KEYSTORE_B64: ${{ secrets.COUNTAWAY_RELEASE_KEYSTORE_B64 }}
          COUNTAWAY_RELEASE_STORE_PASSWORD: ${{ secrets.COUNTAWAY_RELEASE_STORE_PASSWORD }}
          COUNTAWAY_RELEASE_KEY_ALIAS: ${{ secrets.COUNTAWAY_RELEASE_KEY_ALIAS }}
          COUNTAWAY_RELEASE_KEY_PASSWORD: ${{ secrets.COUNTAWAY_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "${COUNTAWAY_RELEASE_KEYSTORE_B64}"
          test -n "${COUNTAWAY_RELEASE_STORE_PASSWORD}"
          test -n "${COUNTAWAY_RELEASE_KEY_ALIAS}"
          test -n "${COUNTAWAY_RELEASE_KEY_PASSWORD}"

          BUILD_TOOLS_VERSION="$(ls -1 "${ANDROID_HOME}/build-tools" | sort -V | tail -n 1)"
          BUILD_TOOLS_DIR="${ANDROID_HOME}/build-tools/${BUILD_TOOLS_VERSION}"
          ZIPALIGN="${BUILD_TOOLS_DIR}/zipalign"
          APKSIGNER="${BUILD_TOOLS_DIR}/apksigner"
          AAPT="${BUILD_TOOLS_DIR}/aapt"

          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "${UNSIGNED_APK}"

          SIGNING_DIR="${RUNNER_TEMP}/countaway-signing"
          DIST_DIR="${GITHUB_WORKSPACE}/dist"
          mkdir -p "${SIGNING_DIR}" "${DIST_DIR}"

          KEYSTORE="${SIGNING_DIR}/countaway-release.jks"
          printf '%s' "${COUNTAWAY_RELEASE_KEYSTORE_B64}" | base64 --decode > "${KEYSTORE}"
          chmod 600 "${KEYSTORE}"

          ALIGNED_APK="${SIGNING_DIR}/CountAway-v${VERSION}-aligned.apk"
          APK_NAME="CountAway-v${VERSION}.apk"
          FINAL_APK="${DIST_DIR}/${APK_NAME}"

          "${ZIPALIGN}" -P 16 -f -v 4 "${UNSIGNED_APK}" "${ALIGNED_APK}"
          "${APKSIGNER}" sign \
            --ks "${KEYSTORE}" \
            --ks-key-alias "${COUNTAWAY_RELEASE_KEY_ALIAS}" \
            --ks-pass env:COUNTAWAY_RELEASE_STORE_PASSWORD \
            --key-pass env:COUNTAWAY_RELEASE_KEY_PASSWORD \
            --out "${FINAL_APK}" \
            "${ALIGNED_APK}"

          "${ZIPALIGN}" -P 16 -c -v 4 "${FINAL_APK}"
          "${APKSIGNER}" verify --verbose --print-certs "${FINAL_APK}" \
            | tee "${DIST_DIR}/CountAway-v${VERSION}-signing.txt"

          "${AAPT}" dump badging "${FINAL_APK}" \
            | tee "${DIST_DIR}/CountAway-v${VERSION}-badging.txt"
          grep -Fq "package: name='com.santiagorodriguez.countaway'" \
            "${DIST_DIR}/CountAway-v${VERSION}-badging.txt"
          grep -Fq "versionCode='${VERSION_CODE}' versionName='${VERSION}'" \
            "${DIST_DIR}/CountAway-v${VERSION}-badging.txt"

          (
            cd "${DIST_DIR}"
            sha256sum "${APK_NAME}" > "${APK_NAME}.sha256"
          )

      - name: Upload release candidate
        if: github.event_name == 'workflow_dispatch' && steps.version.outputs.prepare_release == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: CountAway-v${{ steps.version.outputs.version }}-release-candidate
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Upload release bundle
        if: steps.version.outputs.prepare_release == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: CountAway-v${{ steps.version.outputs.version }}-release-bundle
          path: |
            dist/CountAway-v${{ steps.version.outputs.version }}.apk
            dist/CountAway-v${{ steps.version.outputs.version }}.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload R8 mapping
        uses: actions/upload-artifact@v7
        with:
          name: CountAway-v${{ steps.version.outputs.version }}-r8-mapping
          path: app/build/outputs/mapping/release/
          if-no-files-found: error
          retention-days: 90

  draft-release:
    name: Prepare draft GitHub Release
    if: needs.build-signed-apk.outputs.prepare_release == 'true'
    needs: build-signed-apk
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Verify existing tag target
        env:
          VERSION: ${{ needs.build-signed-apk.outputs.version }}
        run: |
          set -euo pipefail

          TAG="v${VERSION}"
          if git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            TAG_SHA="$(git rev-list -n 1 "refs/tags/${TAG}")"
            if [[ "${TAG_SHA}" != "${GITHUB_SHA}" ]]; then
              echo "${TAG} already points to ${TAG_SHA}, expected ${GITHUB_SHA}" >&2
              exit 1
            fi
          fi

      - name: Download release bundle
        uses: actions/download-artifact@v7
        with:
          name: CountAway-v${{ needs.build-signed-apk.outputs.version }}-release-bundle
          path: release-assets

      - name: Create or update draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.build-signed-apk.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: CountAway v${{ needs.build-signed-apk.outputs.version }}
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          body_path: docs/releases/${{ needs.build-signed-apk.outputs.version }}.md
          files: |
            release-assets/CountAway-v${{ needs.build-signed-apk.outputs.version }}.apk
            release-assets/CountAway-v${{ needs.build-signed-apk.outputs.version }}.apk.sha256
