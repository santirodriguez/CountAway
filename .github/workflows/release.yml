name: CountAway Release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Release action
        required: true
        default: release-candidate
        type: choice
        options:
          - release-candidate
          - prepare-draft-release
      expected_sha:
        description: Exact 40-character commit SHA expected for this manual run
        required: true
        type: string
  push:
    tags:
      - "v*"

concurrency:
  group: countaway-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-signed-apk:
    name: Build signed APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      ANDROID_BUILD_TOOLS_VERSION: "34.0.0"
      EXPECTED_SIGNING_CERT_SHA256: "dfbf9e4ba5b71bc4f7e70ee58f514410f90fb1aee9e9ebe522af68ad93cad42a"
      PACKAGE_ID: "com.santiagorodriguez.countaway"
      PREVIOUS_PUBLIC_APK_BYTES: "377945"
      FIRST_CURRENT_RC_APK_BYTES: "382041"
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_code: ${{ steps.version.outputs.version_code }}
      source_sha: ${{ steps.version.outputs.source_sha }}
      prepare_release: ${{ steps.version.outputs.prepare_release }}
      unsigned_apk_sha256: ${{ steps.apk.outputs.unsigned_apk_sha256 }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Resolve release version
        id: version
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
          EXPECTED_MANUAL_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail

          mapfile -t VERSION_NAMES < <(
            sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts
          )
          mapfile -t VERSION_CODES < <(
            sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' app/build.gradle.kts
          )

          if [[ "${#VERSION_NAMES[@]}" -ne 1 ]]; then
            echo "Expected exactly one versionName in app/build.gradle.kts, found ${#VERSION_NAMES[@]}" >&2
            exit 1
          fi
          if [[ "${#VERSION_CODES[@]}" -ne 1 ]]; then
            echo "Expected exactly one versionCode in app/build.gradle.kts, found ${#VERSION_CODES[@]}" >&2
            exit 1
          fi

          APP_VERSION="${VERSION_NAMES[0]}"
          VERSION_CODE="${VERSION_CODES[0]}"

          if [[ ! "${APP_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid app versionName: ${APP_VERSION}" >&2
            exit 1
          fi
          if [[ ! "${VERSION_CODE}" =~ ^[1-9][0-9]*$ ]]; then
            echo "Invalid app versionCode: ${VERSION_CODE}" >&2
            exit 1
          fi

          case "${GITHUB_EVENT_NAME}" in
            workflow_dispatch)
              if [[ "${GITHUB_REF_TYPE}" != "branch" ]]; then
                echo "Manual release runs must run from a branch, got ${GITHUB_REF_TYPE}: ${GITHUB_REF}" >&2
                exit 1
              fi
              if [[ ! "${EXPECTED_MANUAL_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
                echo "Manual release runs require the exact 40-character source SHA" >&2
                exit 1
              fi
              if [[ "${GITHUB_SHA}" != "${EXPECTED_MANUAL_SHA}" ]]; then
                echo "Selected ref resolved to ${GITHUB_SHA}, expected ${EXPECTED_MANUAL_SHA}" >&2
                exit 1
              fi

              VERSION="${APP_VERSION}"
              case "${REQUESTED_MODE}" in
                release-candidate)
                  PREPARE_RELEASE="false"
                  ;;
                prepare-draft-release)
                  if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
                    echo "Draft release preparation must run from main, got: ${GITHUB_REF}" >&2
                    exit 1
                  fi
                  PREPARE_RELEASE="true"
                  ;;
                *)
                  echo "Unsupported release mode: ${REQUESTED_MODE}" >&2
                  exit 1
                  ;;
              esac
              ;;
            push)
              if [[ "${GITHUB_REF_TYPE}" != "tag" || ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                echo "Release preparation requires a stable semantic tag such as v1.2.3, got: ${GITHUB_REF}" >&2
                exit 1
              fi
              VERSION="${GITHUB_REF_NAME#v}"
              if [[ "${VERSION}" != "${APP_VERSION}" ]]; then
                echo "Tag version ${VERSION} does not match app versionName ${APP_VERSION}" >&2
                exit 1
              fi
              PREPARE_RELEASE="true"
              ;;
            *)
              echo "Unsupported release event: ${GITHUB_EVENT_NAME}" >&2
              exit 1
              ;;
          esac

          printf 'version=%s\n' "${VERSION}" >> "${GITHUB_OUTPUT}"
          printf 'version_code=%s\n' "${VERSION_CODE}" >> "${GITHUB_OUTPUT}"
          printf 'source_sha=%s\n' "${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
          printf 'prepare_release=%s\n' "${PREPARE_RELEASE}" >> "${GITHUB_OUTPUT}"
          printf 'VERSION=%s\n' "${VERSION}" >> "${GITHUB_ENV}"
          printf 'VERSION_CODE=%s\n' "${VERSION_CODE}" >> "${GITHUB_ENV}"
          printf 'PREPARE_RELEASE=%s\n' "${PREPARE_RELEASE}" >> "${GITHUB_ENV}"

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Validate source and runtime contracts
        run: |
          set -euo pipefail

          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -s "docs/assets/branding/countaway.webp"
          grep -Fq 'android:allowBackup="false"' app/src/main/AndroidManifest.xml
          grep -Fq 'android:dataExtractionRules="@xml/data_extraction_rules"' app/src/main/AndroidManifest.xml
          grep -Fq 'android:fullBackupContent="@xml/backup_rules"' app/src/main/AndroidManifest.xml
          test -s "app/src/main/res/xml/data_extraction_rules.xml"
          test -s "app/src/main/res/xml/backup_rules.xml"
          grep -Fq 'applicationId = "com.santiagorodriguez.countaway"' app/build.gradle.kts
          grep -Fq 'minSdk = 26' app/build.gradle.kts
          grep -Fq 'targetSdk = 36' app/build.gradle.kts
          grep -Fq 'compileSdk = 36' app/build.gradle.kts
          grep -Fq 'isMinifyEnabled = true' app/build.gradle.kts
          grep -Fq 'isShrinkResources = true' app/build.gradle.kts

          mkdir -p release-evidence
          RUNTIME_REPORT="release-evidence/CountAway-v${VERSION}-runtime-dependencies.txt"
          ./gradlew -q :app:dependencies --configuration releaseRuntimeClasspath --console=plain > "${RUNTIME_REPORT}"

          if grep -Eq '^[[:space:]]*(implementation|api|runtimeOnly|releaseImplementation|releaseRuntimeOnly)[[:space:]]*\(' app/build.gradle.kts; then
            echo "Unexpected app-declared release runtime dependency found in app/build.gradle.kts" >&2
            exit 1
          fi

          mapfile -t RUNTIME_MODULES < <(
            grep -Eo '([A-Za-z0-9_.-]+:){2}[A-Za-z0-9_.+-]+' "${RUNTIME_REPORT}" | sort -u
          )
          mapfile -t EXPECTED_RUNTIME_MODULES < <(
            printf '%s\n' \
              "org.jetbrains.kotlin:kotlin-stdlib:2.2.10" \
              "org.jetbrains:annotations:13.0" \
              | sort
          )
          if [[ "${RUNTIME_MODULES[*]}" != "${EXPECTED_RUNTIME_MODULES[*]}" ]]; then
            echo "Unexpected release runtime classpath:" >&2
            printf '  %s\n' "${RUNTIME_MODULES[@]}" >&2
            echo "Expected only the AGP/Kotlin baseline:" >&2
            printf '  %s\n' "${EXPECTED_RUNTIME_MODULES[@]}" >&2
            exit 1
          fi

          RUNTIME_MODULES_CSV="$(IFS=,; echo "${RUNTIME_MODULES[*]}")"
          {
            echo "source_sha=${GITHUB_SHA}"
            echo "github_ref=${GITHUB_REF}"
            echo "event_name=${GITHUB_EVENT_NAME}"
            echo "version=${VERSION}"
            echo "version_code=${VERSION_CODE}"
            echo "app_declared_runtime_dependencies=none"
            echo "release_runtime_modules=${RUNTIME_MODULES_CSV}"
          } > "release-evidence/CountAway-v${VERSION}-source.txt"

      - name: Install pinned Android signing tools
        run: |
          set -euo pipefail

          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          test -x "${SDKMANAGER}"
          "${SDKMANAGER}" --install "build-tools;${ANDROID_BUILD_TOOLS_VERSION}" >/dev/null

          BUILD_TOOLS_DIR="${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS_VERSION}"
          test -x "${BUILD_TOOLS_DIR}/zipalign"
          test -x "${BUILD_TOOLS_DIR}/apksigner"
          test -x "${BUILD_TOOLS_DIR}/aapt"
          "${BUILD_TOOLS_DIR}/apksigner" version

      - name: Verify initial F-Droid publication gate
        if: steps.version.outputs.prepare_release == 'true'
        run: |
          set -euo pipefail

          BUILD_TOOLS_DIR="${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS_VERSION}"
          APKSIGNER="${BUILD_TOOLS_DIR}/apksigner"
          AAPT="${BUILD_TOOLS_DIR}/aapt"
          GATE_DIR="${RUNNER_TEMP}/countaway-fdroid-gate"
          mkdir -p "${GATE_DIR}" release-evidence

          PACKAGE_JSON="${GATE_DIR}/package.json"
          curl --fail --location --silent --show-error --retry 2             "https://f-droid.org/api/v1/packages/${PACKAGE_ID}"             --output "${PACKAGE_JSON}"

          jq -e --arg package "${PACKAGE_ID}"             '.packageName == $package and (.packages | length > 0)'             "${PACKAGE_JSON}" >/dev/null

          FDROID_VERSION_CODE="$(
            jq -r '[.packages[].versionCode] | max // empty' "${PACKAGE_JSON}"
          )"
          if [[ ! "${FDROID_VERSION_CODE}" =~ ^[1-9][0-9]*$ ]]; then
            echo "F-Droid API did not expose a published CountAway version code" >&2
            exit 1
          fi

          FDROID_VERSION_NAME="$(
            jq -r --argjson code "${FDROID_VERSION_CODE}"               '.packages[] | select(.versionCode == $code) | .versionName'               "${PACKAGE_JSON}" | head -n 1
          )"
          if [[ -z "${FDROID_VERSION_NAME}" || "${FDROID_VERSION_NAME}" == "null" ]]; then
            echo "F-Droid API did not expose a published CountAway version name" >&2
            exit 1
          fi

          FDROID_APK="${GATE_DIR}/${PACKAGE_ID}_${FDROID_VERSION_CODE}.apk"
          FDROID_APK_URL="https://f-droid.org/repo/${PACKAGE_ID}_${FDROID_VERSION_CODE}.apk"
          curl --fail --location --silent --show-error --retry 2             "${FDROID_APK_URL}"             --output "${FDROID_APK}"
          test -s "${FDROID_APK}"

          FDROID_SIGNING_REPORT="${GATE_DIR}/signing.txt"
          "${APKSIGNER}" verify --verbose --print-certs "${FDROID_APK}"             | tee "${FDROID_SIGNING_REPORT}"

          FDROID_CERT_SHA256="$(
            sed -nE 's/^Signer #1 certificate SHA-256 digest: ([[:xdigit:]]+)$/\1/p'               "${FDROID_SIGNING_REPORT}"               | head -n 1               | tr '[:upper:]' '[:lower:]'
          )"
          if [[ "${FDROID_CERT_SHA256}" != "${EXPECTED_SIGNING_CERT_SHA256}" ]]; then
            echo "Published F-Droid APK signing identity does not match CountAway" >&2
            exit 1
          fi

          "${AAPT}" dump badging "${FDROID_APK}" > "${GATE_DIR}/badging.txt"
          grep -Fq "package: name='${PACKAGE_ID}'" "${GATE_DIR}/badging.txt"

          {
            echo "status=pass"
            echo "package=${PACKAGE_ID}"
            echo "published_version=${FDROID_VERSION_NAME}"
            echo "published_version_code=${FDROID_VERSION_CODE}"
            echo "apk_url=${FDROID_APK_URL}"
            echo "signing_cert_sha256=${FDROID_CERT_SHA256}"
            echo "checked_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "note=APK download and signing identity verified; install smoke test remains a manual release gate."
          } > "release-evidence/CountAway-fdroid-gate.txt"

      - name: Validate release metadata
        run: |
          set -euo pipefail

          if [[ "${PREPARE_RELEASE}" == "true" ]]; then
            grep -Fqx "## ${VERSION}" CHANGELOG.md
            test -s "docs/releases/${VERSION}.md"
            test ! -d "fastlane/metadata/android/en"
            for locale in en-US es ca; do
              test -s "fastlane/metadata/android/${locale}/changelogs/${VERSION_CODE}.txt"
            done

            declare -a SCREENSHOTS=(
              "fastlane/metadata/android/en-US/images/phoneScreenshots/1.png"
              "fastlane/metadata/android/en-US/images/phoneScreenshots/2.png"
              "fastlane/metadata/android/en-US/images/phoneScreenshots/3.png"
              "fastlane/metadata/android/en-US/images/phoneScreenshots/4.png"
            )
            for screenshot in "${SCREENSHOTS[@]}"; do
              test -s "${screenshot}"
              file "${screenshot}" | grep -Fq "PNG image data"
            done
            sha256sum "${SCREENSHOTS[@]}"               > "release-evidence/CountAway-v${VERSION}-screenshots.sha256"

            grep -Fq 'phoneScreenshots/1.png" alt="CountAway home screen"' README.md
            grep -Fq 'phoneScreenshots/2.png" alt="CountAway countdown editor"' README.md
            grep -Fq 'phoneScreenshots/3.png" alt="CountAway widget configuration"' README.md
            grep -Fq 'phoneScreenshots/4.png" alt="CountAway home-screen widget"' README.md
          fi

      - name: Build optimized release
        run: ./gradlew clean test lint assembleDebugAndroidTest assembleRelease --stacktrace

      - name: Sign and verify APK
        id: apk
        env:
          COUNTAWAY_RELEASE_KEYSTORE_B64: ${{ secrets.COUNTAWAY_RELEASE_KEYSTORE_B64 }}
          COUNTAWAY_RELEASE_STORE_PASSWORD: ${{ secrets.COUNTAWAY_RELEASE_STORE_PASSWORD }}
          COUNTAWAY_RELEASE_KEY_ALIAS: ${{ secrets.COUNTAWAY_RELEASE_KEY_ALIAS }}
          COUNTAWAY_RELEASE_KEY_PASSWORD: ${{ secrets.COUNTAWAY_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "${COUNTAWAY_RELEASE_KEYSTORE_B64}"
          test -n "${COUNTAWAY_RELEASE_STORE_PASSWORD}"
          test -n "${COUNTAWAY_RELEASE_KEY_ALIAS}"
          test -n "${COUNTAWAY_RELEASE_KEY_PASSWORD}"

          BUILD_TOOLS_DIR="${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS_VERSION}"
          ZIPALIGN="${BUILD_TOOLS_DIR}/zipalign"
          APKSIGNER="${BUILD_TOOLS_DIR}/apksigner"
          AAPT="${BUILD_TOOLS_DIR}/aapt"

          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "${UNSIGNED_APK}"
          test -s "app/build/outputs/mapping/release/mapping.txt"

          SIGNING_DIR="${RUNNER_TEMP}/countaway-signing"
          DIST_DIR="${GITHUB_WORKSPACE}/dist"
          mkdir -p "${SIGNING_DIR}" "${DIST_DIR}"

          KEYSTORE="${SIGNING_DIR}/countaway-release.jks"
          printf '%s' "${COUNTAWAY_RELEASE_KEYSTORE_B64}" | base64 --decode > "${KEYSTORE}"
          chmod 600 "${KEYSTORE}"

          APK_NAME="CountAway-v${VERSION}.apk"
          FINAL_APK="${DIST_DIR}/${APK_NAME}"
          SIGNING_REPORT="${DIST_DIR}/CountAway-v${VERSION}-signing.txt"
          BADGING_REPORT="${DIST_DIR}/CountAway-v${VERSION}-badging.txt"
          PERMISSIONS_REPORT="${DIST_DIR}/CountAway-v${VERSION}-permissions.txt"
          VERIFICATION_REPORT="${DIST_DIR}/CountAway-v${VERSION}-verification.txt"
          SIZE_REPORT="${DIST_DIR}/CountAway-v${VERSION}-size-comparison.txt"
          RUNTIME_REPORT="release-evidence/CountAway-v${VERSION}-runtime-dependencies.txt"

          UNSIGNED_APK_SHA256="$(sha256sum "${UNSIGNED_APK}" | awk '{print $1}')"
          printf 'unsigned_apk_sha256=%s\n' "${UNSIGNED_APK_SHA256}" >> "${GITHUB_OUTPUT}"

          # AGP already aligns APK output. Verify it rather than rewriting the archive.
          "${ZIPALIGN}" -c -v 4 "${UNSIGNED_APK}"

          "${APKSIGNER}" sign             --ks "${KEYSTORE}"             --ks-key-alias "${COUNTAWAY_RELEASE_KEY_ALIAS}"             --ks-pass env:COUNTAWAY_RELEASE_STORE_PASSWORD             --key-pass env:COUNTAWAY_RELEASE_KEY_PASSWORD             --out "${FINAL_APK}"             "${UNSIGNED_APK}"

          "${ZIPALIGN}" -c -v 4 "${FINAL_APK}"
          "${APKSIGNER}" verify --verbose --print-certs "${FINAL_APK}" | tee "${SIGNING_REPORT}"

          ACTUAL_SIGNING_CERT_SHA256="$(
            sed -nE 's/^Signer #1 certificate SHA-256 digest: ([[:xdigit:]]+)$/\1/p' "${SIGNING_REPORT}"               | head -n 1               | tr '[:upper:]' '[:lower:]'
          )"
          if [[ -z "${ACTUAL_SIGNING_CERT_SHA256}" ]]; then
            echo "Could not read signer SHA-256 fingerprint from apksigner output" >&2
            exit 1
          fi
          if [[ "${ACTUAL_SIGNING_CERT_SHA256}" != "${EXPECTED_SIGNING_CERT_SHA256}" ]]; then
            echo "Unexpected signing certificate SHA-256: ${ACTUAL_SIGNING_CERT_SHA256}" >&2
            exit 1
          fi

          "${AAPT}" dump badging "${FINAL_APK}" | tee "${BADGING_REPORT}"
          grep -Fq "package: name='${PACKAGE_ID}'" "${BADGING_REPORT}"
          grep -Fq "versionCode='${VERSION_CODE}' versionName='${VERSION}'" "${BADGING_REPORT}"
          grep -Fq "sdkVersion:'26'" "${BADGING_REPORT}"
          grep -Fq "targetSdkVersion:'36'" "${BADGING_REPORT}"
          grep -Fq "compileSdkVersion='36'" "${BADGING_REPORT}"

          mapfile -t ACTUAL_PERMISSIONS < <(
            sed -nE "s/^uses-permission: name='([^']+)'.*/\1/p" "${BADGING_REPORT}" | sort -u
          )
          mapfile -t EXPECTED_PERMISSIONS < <(
            printf '%s\n'               "android.permission.POST_NOTIFICATIONS"               "android.permission.RECEIVE_BOOT_COMPLETED"               | sort
          )
          if [[ "${ACTUAL_PERMISSIONS[*]}" != "${EXPECTED_PERMISSIONS[*]}" ]]; then
            echo "Unexpected release permission surface:" >&2
            printf '  %s\n' "${ACTUAL_PERMISSIONS[@]}" >&2
            exit 1
          fi
          printf '%s\n' "${ACTUAL_PERMISSIONS[@]}" > "${PERMISSIONS_REPORT}"

          if unzip -Z1 "${FINAL_APK}" | grep -Eq '^lib/.+\.so$'; then
            echo "Unexpected native library found in release APK" >&2
            unzip -Z1 "${FINAL_APK}" | grep -E '^lib/.+\.so$' >&2
            exit 1
          fi

          test -s "${RUNTIME_REPORT}"
          cp "${RUNTIME_REPORT}" "${DIST_DIR}/CountAway-v${VERSION}-runtime-dependencies.txt"
          RUNTIME_MODULES_CSV="$(
            grep -Eo '([A-Za-z0-9_.-]+:){2}[A-Za-z0-9_.+-]+' "${RUNTIME_REPORT}"               | sort -u               | paste -sd, -
          )"

          APK_SHA256="$(sha256sum "${FINAL_APK}" | awk '{print $1}')"
          APK_BYTES="$(stat -c%s "${FINAL_APK}")"
          APKSIGNER_VERSION="$("${APKSIGNER}" version | tr -d '\r')"
          DELTA_PREVIOUS="$((APK_BYTES - PREVIOUS_PUBLIC_APK_BYTES))"
          DELTA_FIRST_RC="$((APK_BYTES - FIRST_CURRENT_RC_APK_BYTES))"
          PERCENT_PREVIOUS="$(
            awk -v current="${APK_BYTES}" -v base="${PREVIOUS_PUBLIC_APK_BYTES}"               'BEGIN { printf "%.2f", ((current - base) * 100) / base }'
          )"
          PERCENT_FIRST_RC="$(
            awk -v current="${APK_BYTES}" -v base="${FIRST_CURRENT_RC_APK_BYTES}"               'BEGIN { printf "%.2f", ((current - base) * 100) / base }'
          )"

          (
            cd "${DIST_DIR}"
            sha256sum "${APK_NAME}" > "${APK_NAME}.sha256"
          )

          {
            echo "current_apk_bytes=${APK_BYTES}"
            echo "previous_public_1_1_7_apk_bytes=${PREVIOUS_PUBLIC_APK_BYTES}"
            echo "delta_from_previous_public_bytes=${DELTA_PREVIOUS}"
            echo "delta_from_previous_public_percent=${PERCENT_PREVIOUS}"
            echo "first_current_rc_apk_bytes=${FIRST_CURRENT_RC_APK_BYTES}"
            echo "delta_from_first_current_rc_bytes=${DELTA_FIRST_RC}"
            echo "delta_from_first_current_rc_percent=${PERCENT_FIRST_RC}"
            echo "review=Explain material growth by changed files/resources/dependencies before publication."
          } > "${SIZE_REPORT}"

          {
            echo "source_sha=${GITHUB_SHA}"
            echo "unsigned_apk_sha256=${UNSIGNED_APK_SHA256}"
            echo "version=${VERSION}"
            echo "version_code=${VERSION_CODE}"
            echo "package_id=${PACKAGE_ID}"
            echo "min_sdk=26"
            echo "target_sdk=36"
            echo "compile_sdk=36"
            echo "signing_cert_sha256=${ACTUAL_SIGNING_CERT_SHA256}"
            echo "apksigner_version=${APKSIGNER_VERSION}"
            echo "apk_sha256=${APK_SHA256}"
            echo "apk_bytes=${APK_BYTES}"
            echo "permissions=$(IFS=,; echo "${ACTUAL_PERMISSIONS[*]}")"
            echo "app_declared_runtime_dependencies=none"
            echo "release_runtime_modules=${RUNTIME_MODULES_CSV}"
            echo "native_code=none"
            echo "r8_mapping=present"
            echo "resource_shrinking=enabled"
            echo "branding_asset=docs/assets/branding/countaway.webp"
            echo "instrumented_tests=compiled_not_executed"
          } > "${VERIFICATION_REPORT}"

      - name: Upload release validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CountAway-v${{ steps.version.outputs.version }}-validation-${{ github.sha }}
          path: |
            release-evidence/
            dist/*-badging.txt
            dist/*-permissions.txt
            dist/*-signing.txt
            dist/*-verification.txt
            dist/*-size-comparison.txt
            dist/*-runtime-dependencies.txt
            app/build/reports/
            app/build/test-results/
            app/build/outputs/apk/androidTest/debug/
          if-no-files-found: warn

      - name: Upload release candidate
        if: steps.version.outputs.prepare_release == 'false'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CountAway-v${{ steps.version.outputs.version }}-release-candidate
          path: dist/
          if-no-files-found: error

      - name: Upload release bundle
        if: steps.version.outputs.prepare_release == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CountAway-v${{ steps.version.outputs.version }}-release-bundle
          path: |
            dist/CountAway-v${{ steps.version.outputs.version }}.apk
            dist/CountAway-v${{ steps.version.outputs.version }}.apk.sha256
          if-no-files-found: error

      - name: Upload R8 mapping
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CountAway-v${{ steps.version.outputs.version }}-r8-mapping
          path: app/build/outputs/mapping/release/
          if-no-files-found: error

  reproducibility-check:
    name: Rebuild unsigned APK independently
    needs: build-signed-apk
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.build-signed-apk.outputs.source_sha }}

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Rebuild and compare
        env:
          EXPECTED_UNSIGNED_APK_SHA256: ${{ needs.build-signed-apk.outputs.unsigned_apk_sha256 }}
          SOURCE_SHA: ${{ needs.build-signed-apk.outputs.source_sha }}
          VERSION: ${{ needs.build-signed-apk.outputs.version }}
        run: |
          set -euo pipefail

          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          ./gradlew clean assembleRelease --stacktrace

          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "${UNSIGNED_APK}"
          ACTUAL_UNSIGNED_APK_SHA256="$(sha256sum "${UNSIGNED_APK}" | awk '{print $1}')"

          mkdir -p reproducibility-evidence
          {
            echo "source_sha=${SOURCE_SHA}"
            echo "expected_unsigned_apk_sha256=${EXPECTED_UNSIGNED_APK_SHA256}"
            echo "actual_unsigned_apk_sha256=${ACTUAL_UNSIGNED_APK_SHA256}"
          } > "reproducibility-evidence/CountAway-v${VERSION}-unsigned-rebuild.txt"

          if [[ "${ACTUAL_UNSIGNED_APK_SHA256}" != "${EXPECTED_UNSIGNED_APK_SHA256}" ]]; then
            echo "Independent release rebuild does not match the primary unsigned APK" >&2
            exit 1
          fi

      - name: Upload reproducibility evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CountAway-v${{ needs.build-signed-apk.outputs.version }}-reproducibility-${{ needs.build-signed-apk.outputs.source_sha }}
          path: reproducibility-evidence/
          if-no-files-found: warn

  device-acceptance:
    name: Android API ${{ matrix.api }} candidate acceptance
    if: needs.build-signed-apk.outputs.prepare_release == 'false'
    needs:
      - build-signed-apk
      - reproducibility-check
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 26
            system_image: "system-images;android-26;google_apis;x86_64"
            sdk_channel: 0
            ram_mb: 2048
          - api: 33
            system_image: "system-images;android-33;google_apis;x86_64"
            sdk_channel: 0
            ram_mb: 2048
          - api: 36
            system_image: "system-images;android-36;google_apis;x86_64"
            sdk_channel: 0
            ram_mb: 2048
          - api: 37
            system_image: "system-images;android-37.0;google_apis_ps16k;x86_64"
            sdk_channel: 3
            ram_mb: 4096

    env:
      API_LEVEL: ${{ matrix.api }}
      SYSTEM_IMAGE: ${{ matrix.system_image }}
      SDK_CHANNEL: ${{ matrix.sdk_channel }}
      RAM_MB: ${{ matrix.ram_mb }}
      PACKAGE_ID: "com.santiagorodriguez.countaway"
      VERSION: ${{ needs.build-signed-apk.outputs.version }}
      SOURCE_SHA: ${{ needs.build-signed-apk.outputs.source_sha }}
      AVD_NAME: countaway-api-${{ matrix.api }}

    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.build-signed-apk.outputs.source_sha }}

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Download signed candidate
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: CountAway-v${{ needs.build-signed-apk.outputs.version }}-release-candidate
          path: candidate

      - name: Verify candidate identity
        run: |
          set -euo pipefail

          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          APK="candidate/CountAway-v${VERSION}.apk"
          CHECKSUM="candidate/CountAway-v${VERSION}.apk.sha256"
          test -s "${APK}"
          test -s "${CHECKSUM}"
          (
            cd candidate
            sha256sum -c "CountAway-v${VERSION}.apk.sha256"
          )

      - name: Install Android ${{ matrix.api }} emulator image
        run: |
          set -euo pipefail

          test -e /dev/kvm
          sudo chmod 666 /dev/kvm

          TEST_SDK_ROOT="${RUNNER_TEMP}/countaway-sdk-${API_LEVEL}"
          ANDROID_AVD_HOME="${RUNNER_TEMP}/countaway-avd-${API_LEVEL}"
          export TEST_SDK_ROOT ANDROID_AVD_HOME
          mkdir -p acceptance-evidence "${TEST_SDK_ROOT}" "${ANDROID_AVD_HOME}"
          {
            printf 'TEST_SDK_ROOT=%s\n' "${TEST_SDK_ROOT}"
            printf 'ANDROID_AVD_HOME=%s\n' "${ANDROID_AVD_HOME}"
          } >> "${GITHUB_ENV}"

          BOOTSTRAP_SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          test -x "${BOOTSTRAP_SDKMANAGER}"

          yes | "${BOOTSTRAP_SDKMANAGER}" --sdk_root="${TEST_SDK_ROOT}" --licenses >/dev/null || true
          "${BOOTSTRAP_SDKMANAGER}"             --sdk_root="${TEST_SDK_ROOT}"             --channel="${SDK_CHANNEL}"             --install "cmdline-tools;latest" >/dev/null

          SDKMANAGER="${TEST_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          AVDMANAGER="${TEST_SDK_ROOT}/cmdline-tools/latest/bin/avdmanager"
          EMULATOR="${TEST_SDK_ROOT}/emulator/emulator"
          test -x "${SDKMANAGER}"
          test -x "${AVDMANAGER}"

          yes | "${SDKMANAGER}" --sdk_root="${TEST_SDK_ROOT}" --licenses >/dev/null || true
          "${SDKMANAGER}"             --sdk_root="${TEST_SDK_ROOT}"             --channel="${SDK_CHANNEL}"             --install             "emulator"             "platform-tools"             "${SYSTEM_IMAGE}" >/dev/null

          test -x "${EMULATOR}"
          SDKMANAGER_VERSION="$("${SDKMANAGER}" --version | tail -n 1 | tr -d '\r')"
          if [[ "${API_LEVEL}" -ge 37 ]]; then
            SDKMANAGER_MAJOR="${SDKMANAGER_VERSION%%.*}"
            if [[ ! "${SDKMANAGER_MAJOR}" =~ ^[0-9]+$ || "${SDKMANAGER_MAJOR}" -lt 20 ]]; then
              echo "API 37 AVD creation requires current command-line tools; got ${SDKMANAGER_VERSION}" >&2
              exit 1
            fi
          fi

          IMAGE_TAG="$(printf '%s' "${SYSTEM_IMAGE}" | cut -d';' -f3)"
          IMAGE_ABI="$(printf '%s' "${SYSTEM_IMAGE}" | cut -d';' -f4)"
          AVD_PATH="${ANDROID_AVD_HOME}/${AVD_NAME}.avd"

          "${AVDMANAGER}" create avd             --force             --name "${AVD_NAME}"             --package "${SYSTEM_IMAGE}"             --abi "${IMAGE_TAG}/${IMAGE_ABI}"             --device "pixel_2"             --path "${AVD_PATH}"

          CONFIG_INI="${AVD_PATH}/config.ini"
          test -s "${CONFIG_INI}"
          printf 'hw.ramSize=%s\n' "${RAM_MB}" >> "${CONFIG_INI}"
          printf 'hw.keyboard=yes\n' >> "${CONFIG_INI}"
          printf 'disk.dataPartition.size=4G\n' >> "${CONFIG_INI}"

          {
            echo "api_level=${API_LEVEL}"
            echo "system_image=${SYSTEM_IMAGE}"
            echo "sdk_channel=${SDK_CHANNEL}"
            echo "sdkmanager_version=${SDKMANAGER_VERSION}"
            echo "ram_mb=${RAM_MB}"
            echo "avd_path=${AVD_PATH}"
          } > "acceptance-evidence/emulator-contract-api-${API_LEVEL}.txt"

          printf '%s\n' "${TEST_SDK_ROOT}/platform-tools" >> "${GITHUB_PATH}"

      - name: Start emulator
        run: |
          set -euo pipefail

          mkdir -p acceptance-evidence
          nohup "${TEST_SDK_ROOT}/emulator/emulator"             -avd "${AVD_NAME}"             -no-window             -noaudio             -no-boot-anim             -no-snapshot             -gpu swiftshader_indirect             -memory "${RAM_MB}"             > "acceptance-evidence/emulator-api-${API_LEVEL}.log" 2>&1 &

          adb wait-for-device
          BOOTED=""
          for _ in $(seq 1 150); do
            BOOTED="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
            if [[ "${BOOTED}" == "1" ]]; then
              break
            fi
            sleep 2
          done
          if [[ "${BOOTED}" != "1" ]]; then
            cat "acceptance-evidence/emulator-api-${API_LEVEL}.log" >&2
            exit 1
          fi

          adb shell input keyevent 82 || true
          adb shell settings put global window_animation_scale 0 || true
          adb shell settings put global transition_animation_scale 0 || true
          adb shell settings put global animator_duration_scale 0 || true
          adb shell getprop ro.build.version.release > "acceptance-evidence/android-release-api-${API_LEVEL}.txt"
          adb shell getprop ro.build.version.sdk > "acceptance-evidence/android-sdk-api-${API_LEVEL}.txt"

      - name: Smoke signed upgrade from public 1.1.7
        if: matrix.api == 33
        run: |
          set -euo pipefail

          PREVIOUS_APK="candidate/CountAway-v1.1.7.apk"
          PREVIOUS_APK_URL="https://github.com/santirodriguez/CountAway/releases/download/v1.1.7/CountAway-v1.1.7.apk"
          PREVIOUS_APK_SHA256="fb777e14db0c58d111d0556b7e6d1101083a304e83a14adfd1b86d40852c90fc"
          CANDIDATE_APK="candidate/CountAway-v${VERSION}.apk"

          curl --fail --location --silent --show-error --retry 2             "${PREVIOUS_APK_URL}"             --output "${PREVIOUS_APK}"
          echo "${PREVIOUS_APK_SHA256}  ${PREVIOUS_APK}" | sha256sum -c -

          adb install "${PREVIOUS_APK}"
          adb shell am start -W             -n "${PACKAGE_ID}/com.santiagorodriguez.countaway.ui.MainActivity"             > "acceptance-evidence/upgrade-1.1.7-launch-api-${API_LEVEL}.txt"
          sleep 1
          adb shell dumpsys package "${PACKAGE_ID}"             > "acceptance-evidence/upgrade-before-package-api-${API_LEVEL}.txt"

          adb install -r "${CANDIDATE_APK}"
          adb shell am start -W             -n "${PACKAGE_ID}/com.santiagorodriguez.countaway.ui.MainActivity"             > "acceptance-evidence/upgrade-1.1.8-launch-api-${API_LEVEL}.txt"
          sleep 2

          PID="$(adb shell pidof "${PACKAGE_ID}" | tr -d '\r')"
          if [[ -z "${PID}" ]]; then
            adb logcat -d > "acceptance-evidence/upgrade-logcat-api-${API_LEVEL}.txt" || true
            echo "CountAway did not remain alive after 1.1.7 -> ${VERSION} signed upgrade" >&2
            exit 1
          fi

          adb shell dumpsys package "${PACKAGE_ID}"             > "acceptance-evidence/upgrade-after-package-api-${API_LEVEL}.txt"
          grep -Fq "versionName=${VERSION}" "acceptance-evidence/upgrade-after-package-api-${API_LEVEL}.txt"
          grep -Eq 'versionCode=8([[:space:]]|$)' "acceptance-evidence/upgrade-after-package-api-${API_LEVEL}.txt"
          adb uninstall "${PACKAGE_ID}"

      - name: Smoke signed release APK
        run: |
          set -euo pipefail

          APK="candidate/CountAway-v${VERSION}.apk"
          adb install -r "${APK}"

          adb shell am start -W             -n "${PACKAGE_ID}/com.santiagorodriguez.countaway.ui.MainActivity"             > "acceptance-evidence/signed-launch-api-${API_LEVEL}.txt"

          sleep 2
          PID="$(adb shell pidof "${PACKAGE_ID}" | tr -d '\r')"
          if [[ -z "${PID}" ]]; then
            adb logcat -d > "acceptance-evidence/signed-launch-logcat-api-${API_LEVEL}.txt" || true
            echo "Signed candidate process did not remain alive after launch on API ${API_LEVEL}" >&2
            exit 1
          fi

          adb shell dumpsys package "${PACKAGE_ID}"             > "acceptance-evidence/signed-package-api-${API_LEVEL}.txt"
          adb uninstall "${PACKAGE_ID}"

      - name: Run Android instrumentation tests
        run: ./gradlew connectedDebugAndroidTest --stacktrace

      - name: Capture runtime state
        if: always()
        run: |
          set +e
          adb shell dumpsys alarm > "acceptance-evidence/alarm-api-${API_LEVEL}.txt"
          adb logcat -d > "acceptance-evidence/logcat-api-${API_LEVEL}.txt"
          adb shell dumpsys package "${PACKAGE_ID}"             > "acceptance-evidence/debug-package-api-${API_LEVEL}.txt"
          set -e

      - name: Upload API ${{ matrix.api }} acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CountAway-v${{ needs.build-signed-apk.outputs.version }}-api-${{ matrix.api }}-acceptance-${{ needs.build-signed-apk.outputs.source_sha }}
          path: |
            acceptance-evidence/
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn

  draft-release:
    name: Prepare draft GitHub Release
    if: needs.build-signed-apk.outputs.prepare_release == 'true'
    needs:
      - build-signed-apk
      - reproducibility-check
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.build-signed-apk.outputs.source_sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Verify release target
        env:
          VERSION: ${{ needs.build-signed-apk.outputs.version }}
          SOURCE_SHA: ${{ needs.build-signed-apk.outputs.source_sha }}
        run: |
          set -euo pipefail

          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          TAG="v${VERSION}"

          case "${GITHUB_EVENT_NAME}" in
            workflow_dispatch)
              if [[ "${GITHUB_REF_TYPE}" != "branch" || "${GITHUB_REF}" != "refs/heads/main" ]]; then
                echo "Manual draft release preparation must run from main, got: ${GITHUB_REF}" >&2
                exit 1
              fi

              git rev-parse "refs/remotes/origin/main" >/dev/null
              MAIN_SHA="$(git rev-parse "refs/remotes/origin/main")"
              if [[ "${SOURCE_SHA}" != "${MAIN_SHA}" ]]; then
                echo "Manual draft release must use the current main head ${MAIN_SHA}, got ${SOURCE_SHA}" >&2
                exit 1
              fi

              if git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
                TAG_SHA="$(git rev-list -n 1 "refs/tags/${TAG}")"
                if [[ "${TAG_SHA}" != "${SOURCE_SHA}" ]]; then
                  echo "${TAG} already points to ${TAG_SHA}, expected ${SOURCE_SHA}" >&2
                  exit 1
                fi
              fi
              ;;
            push)
              if [[ "${GITHUB_REF_TYPE}" != "tag" || "${GITHUB_REF_NAME}" != "${TAG}" ]]; then
                echo "Expected release tag ${TAG}, got ${GITHUB_REF}" >&2
                exit 1
              fi

              git rev-parse "refs/tags/${TAG}" >/dev/null
              TAG_SHA="$(git rev-list -n 1 "refs/tags/${TAG}")"
              if [[ "${TAG_SHA}" != "${SOURCE_SHA}" ]]; then
                echo "${TAG} points to ${TAG_SHA}, expected ${SOURCE_SHA}" >&2
                exit 1
              fi

              git rev-parse "refs/remotes/origin/main" >/dev/null
              if ! git merge-base --is-ancestor "${SOURCE_SHA}" "refs/remotes/origin/main"; then
                echo "${TAG} does not point to a commit in main history" >&2
                exit 1
              fi
              ;;
            *)
              echo "Unsupported draft release event: ${GITHUB_EVENT_NAME}" >&2
              exit 1
              ;;
          esac

      - name: Download release bundle
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: CountAway-v${{ needs.build-signed-apk.outputs.version }}-release-bundle
          path: release-assets

      - name: Verify release bundle checksum
        env:
          VERSION: ${{ needs.build-signed-apk.outputs.version }}
        run: |
          set -euo pipefail
          test -f "release-assets/CountAway-v${VERSION}.apk"
          test -f "release-assets/CountAway-v${VERSION}.apk.sha256"
          (
            cd release-assets
            sha256sum -c "CountAway-v${VERSION}.apk.sha256"
          )

      - name: Protect published release assets from mutation
        id: asset_guard
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build-signed-apk.outputs.version }}
        run: |
          set -euo pipefail

          printf 'skip_release=false\n' >> "${GITHUB_OUTPUT}"
          TAG="v${VERSION}"
          RELEASE_JSON="${RUNNER_TEMP}/existing-release.json"
          RELEASE_ERROR="${RUNNER_TEMP}/existing-release.err"

          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" > "${RELEASE_JSON}" 2> "${RELEASE_ERROR}"; then
            if [[ "$(jq -r '.draft' "${RELEASE_JSON}")" == "false" ]]; then
              for asset in "CountAway-v${VERSION}.apk" "CountAway-v${VERSION}.apk.sha256"; do
                EXPECTED_DIGEST="sha256:$(sha256sum "release-assets/${asset}" | awk '{print $1}')"
                ACTUAL_DIGEST="$(
                  jq -r --arg name "${asset}"                     '.assets[]? | select(.name == $name) | .digest // empty'                     "${RELEASE_JSON}"
                )"
                if [[ -z "${ACTUAL_DIGEST}" ]]; then
                  echo "Published release ${TAG} exists without immutable asset digest for ${asset}" >&2
                  exit 1
                fi
                if [[ "${ACTUAL_DIGEST}" != "${EXPECTED_DIGEST}" ]]; then
                  echo "Refusing to replace published ${asset}: ${ACTUAL_DIGEST} != ${EXPECTED_DIGEST}" >&2
                  exit 1
                fi
              done
              echo "Published release already contains the same APK and checksum; no mutation is needed."
              printf 'skip_release=true\n' >> "${GITHUB_OUTPUT}"
            fi
          else
            if ! grep -Fq "HTTP 404" "${RELEASE_ERROR}"; then
              cat "${RELEASE_ERROR}" >&2
              exit 1
            fi
          fi

      - name: Create or update draft release
        if: steps.asset_guard.outputs.skip_release != 'true'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: v${{ needs.build-signed-apk.outputs.version }}
          target_commitish: ${{ needs.build-signed-apk.outputs.source_sha }}
          name: CountAway v${{ needs.build-signed-apk.outputs.version }}
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          prerelease: false
          fail_on_unmatched_files: true
          body_path: docs/releases/${{ needs.build-signed-apk.outputs.version }}.md
          files: |
            release-assets/CountAway-v${{ needs.build-signed-apk.outputs.version }}.apk
            release-assets/CountAway-v${{ needs.build-signed-apk.outputs.version }}.apk.sha256
