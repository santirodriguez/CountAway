name: Android CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Record source identity
        run: |
          set -euo pipefail
          mkdir -p ci-evidence
          {
            echo "checked_out_sha=$(git rev-parse HEAD)"
            echo "github_sha=${GITHUB_SHA}"
            echo "github_ref=${GITHUB_REF}"
            echo "event_name=${GITHUB_EVENT_NAME}"
            echo "pr_head_sha=${{ github.event.pull_request.head.sha || '' }}"
            echo "instrumented_tests=compiled_not_executed"
          } > ci-evidence/source.txt

      - name: Validate
        run: ./gradlew test lint assembleDebug assembleDebugAndroidTest assembleRelease --stacktrace

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CountAway-android-ci-${{ github.sha }}
          path: |
            ci-evidence/
            app/build/reports/
            app/build/test-results/
            app/build/outputs/apk/androidTest/debug/
          if-no-files-found: warn
