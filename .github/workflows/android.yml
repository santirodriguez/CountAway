name: Android CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Record source identity
        run: |
          set -euo pipefail
          mkdir -p ci-evidence
          {
            echo "checked_out_sha=$(git rev-parse HEAD)"
            echo "github_sha=${GITHUB_SHA}"
            echo "github_ref=${GITHUB_REF}"
            echo "event_name=${GITHUB_EVENT_NAME}"
            echo "pr_head_sha=${{ github.event.pull_request.head.sha || '' }}"
            echo "instrumented_tests=compiled_not_executed"
          } > ci-evidence/source.txt

      - name: Validate
        run: ./gradlew test lint assembleDebug assembleDebugAndroidTest assembleRelease bundleRelease --stacktrace

      - name: Validate Play-readiness bundle
        run: |
          set -euo pipefail

          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -s "${AAB}"
          unzip -Z1 "${AAB}" > "${RUNNER_TEMP}/countaway-aab-files.txt"
          grep -Fxq "BundleConfig.pb" "${RUNNER_TEMP}/countaway-aab-files.txt"
          grep -Fxq "base/manifest/AndroidManifest.xml" "${RUNNER_TEMP}/countaway-aab-files.txt"
          grep -Eq '^base/dex/classes([0-9]*)?\.dex
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CountAway-android-ci-${{ github.sha }}
          path: |
            ci-evidence/
            app/build/reports/
            app/build/test-results/
            app/build/outputs/apk/androidTest/debug/
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: warn
 "${RUNNER_TEMP}/countaway-aab-files.txt"

          VERSION="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts)"
          VERSION_CODE="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' app/build.gradle.kts)"
          {
            echo "source_sha=${GITHUB_SHA}"
            echo "application_id=com.santiagorodriguez.countaway"
            echo "version=${VERSION}"
            echo "version_code=${VERSION_CODE}"
            echo "aab_sha256=$(sha256sum "${AAB}" | awk '{print $1}')"
            echo "aab_bytes=$(stat -c%s "${AAB}")"
            echo "purpose=play-readiness-validation"
            echo "public_release_asset=false"
            echo "play_upload_signing=deferred"
          } > ci-evidence/play-readiness.txt

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CountAway-android-ci-${{ github.sha }}
          path: |
            ci-evidence/
            app/build/reports/
            app/build/test-results/
            app/build/outputs/apk/androidTest/debug/
          if-no-files-found: warn
