name: Store screenshots

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  capture:
    if: >-
      github.event.label.name == 'capture-store-screenshots' &&
      github.event.pull_request.number == 39 &&
      github.event.pull_request.head.ref == 'release/1.2.3' &&
      github.event.pull_request.head.repo.full_name == 'santirodriguez/CountAway'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Build app and prepare capture
        run: |
          set -euo pipefail
          ./gradlew assembleDebug
          python3 -m pip install --quiet --break-system-packages 'Pillow==11.3.0'
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: Capture six screens
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: python3 scripts/capture-store-screenshots.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0 # v7.0.1
        with:
          name: CountAway-v1.2.3-six-screens-${{ github.event.pull_request.head.sha }}
          path: store-screenshots/[1-6].png
          if-no-files-found: error
          retention-days: 7
